name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        env:
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
        run: >-
          flutter build web --release --no-pub --base-href "/WanderStamp/"
          --dart-define="APP_CHECK_SITE_KEY=$APP_CHECK_SITE_KEY"

      - name: Package Pages artifact
        run: >-
          tar --directory build/web --dereference --hard-dereference
          --exclude=.git --exclude=.github --create --file "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
